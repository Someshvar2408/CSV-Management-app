name: Expose Flask app via ngrok

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  expose-app:
    runs-on: ubuntu-latest
    env:
      # Port the app will bind to inside the runner
      APP_PORT: 8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flask pandas flask-cors gunicorn python-dotenv
          fi

      - name: Ensure uploads directory exists
        run: |
          mkdir -p uploads

      - name: Start app with gunicorn
        run: |
          # Start gunicorn in background; logs to gunicorn.log
          nohup gunicorn --bind 0.0.0.0:${{ env.APP_PORT }} "app:app" --workers 1 --threads 2 > gunicorn.log 2>&1 &
          sleep 2
          echo "Started gunicorn (logs -> gunicorn.log)"

      - name: Download ngrok (v3+)
        run: |
          set -euo pipefail
          echo "Fetching latest ngrok (v3+) linux-amd64 release URL..."
          NGROK_URL=$(curl -sSf https://api.github.com/repos/ngrok/ngrok/releases/latest \
            | jq -r '.assets[] | select(.name|test("linux.*amd64|amd64.*linux|linux.*x86_64|x86_64.*linux")) | .browser_download_url' \
            | head -n1)
          if [ -z "${NGROK_URL:-}" ]; then
            echo "Failed to determine ngrok download URL"; exit 1
          fi
          echo "Downloading $NGROK_URL"
          curl -sSL "$NGROK_URL" -o ngrok.asset
          # Try extracting tarball first, fallback to unzip/search
          if tar -tzf ngrok.asset >/dev/null 2>&1; then
            tar -xzf ngrok.asset
          else
            mkdir -p ngrok_extracted
            if unzip -q ngrok.asset -d ngrok_extracted >/dev/null 2>&1; then
              :
            else
              # fallback: try tar extraction into ngrok_extracted (handles some tar variants)
              tar -xzf ngrok.asset -C ngrok_extracted >/dev/null 2>&1 || true
            fi
            # locate binary inside extracted tree
            if [ -f ngrok_extracted/ngrok ]; then
              mv ngrok_extracted/ngrok .
            else
              FOUND=$(find ngrok_extracted -type f -name ngrok -print -quit || true)
              if [ -n "$FOUND" ]; then
                mv "$FOUND" .
              else
                echo "Could not extract ngrok binary"; ls -la ngrok_extracted || true; exit 1
              fi
            fi
          fi
          chmod +x ngrok
          ./ngrok version

      - name: Start ngrok and print public URL (v3+)
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${NGROK_AUTHTOKEN:-}" ]; then
            echo "NGROK_AUTHTOKEN not set. Please add it to repository secrets."
            exit 1
          fi

          # Configure ngrok (v3+)
          ./ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          LOGFILE=ngrok.log
          # start ngrok in background
          ./ngrok http "$APP_PORT" --log=stdout >"$LOGFILE" 2>&1 &
          NGROK_PID=$!

          # wait for ngrok local API to become available
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "ngrok tunnels API output:"
          cat "$LOGFILE" || true

          PUBLIC_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' || true)
          if [ -z "$PUBLIC_URL" ] || [ "$PUBLIC_URL" = "null" ]; then
            echo "Failed to get public URL from ngrok API. Dumping /api/tunnels response:"
            curl --silent http://127.0.0.1:4040/api/tunnels || true
            kill "$NGROK_PID" >/dev/null 2>&1 || true
            exit 1
          fi

          echo "Application should be reachable at: $PUBLIC_URL"
          # Keep the job running for a while so the endpoint is available; adjust timeout as needed
          echo "Keeping job alive for 1 hour (3600s). To stop sooner cancel the workflow run."
          sleep 3600 &
          wait
